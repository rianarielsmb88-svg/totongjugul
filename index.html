}

<script>
/* =========================================
   BLOK KLIK KANAN
========================================= */
document.addEventListener('contextmenu', function(e) {
  e.preventDefault();
});


/* =========================================
   BLOK SHORTCUT KEYBOARD
========================================= */
document.addEventListener('keydown', function(e) {

  // Ctrl + U
  if (e.ctrlKey && e.key.toLowerCase() === 'u') {
    e.preventDefault();
    return false;
  }

  // Ctrl + Shift + I
  if (e.ctrlKey && e.shiftKey && e.key.toLowerCase() === 'i') {
    e.preventDefault();
    return false;
  }

  // Ctrl + Shift + J
  if (e.ctrlKey && e.shiftKey && e.key.toLowerCase() === 'j') {
    e.preventDefault();
    return false;
  }

  // Ctrl + Shift + C
  if (e.ctrlKey && e.shiftKey && e.key.toLowerCase() === 'c') {
    e.preventDefault();
    return false;
  }

  // F12
  if (e.key === 'F12') {
    e.preventDefault();
    return false;
  }

});


/* =========================================
   PERINGATAN SAAT DEVTOOLS TERDETEKSI
   CATATAN: TIDAK 100% AKURAT
========================================= */

(function() {

  const threshold = 160;

  setInterval(function() {

    const widthDiff =
      window.outerWidth - window.innerWidth;

    const heightDiff =
      window.outerHeight - window.innerHeight;

    if (
      widthDiff > threshold ||
      heightDiff > threshold
    ) {

      console.clear();

      // Jangan lakukan redirect jika tidak diperlukan
      // Contoh:
      // document.body.innerHTML = '';

      console.log(
        'HAYO MAU NGAPAIN LU KONTOL .'
      );

    }

  }, 1000);

})();
</script>
