function hash(str){
 let h=2166136261;
 for(let i=0;i<str.length;i++){
   h^=str.charCodeAt(i);
   h=Math.imul(h,16777619);
 }
 return h>>>0;
}
function rand(min,max,key){
 const x=Math.abs(Math.sin(hash(key))*1000000)%1;
 return Math.floor(min+x*(max-min+1));
}
function list(cnt,min,max,key){
 let a=[];
 for(let i=0;i<cnt;i++){
   a.push(rand(min,max,key+"-"+i).toString().padStart((max>999)?4:(max>99)?3:2,"0"));
 }
 return a.join(" / ");
}
function generate(){
const p=document.getElementById("pasaran").value;
if(!p){alert("Pilih pasaran.");return;}
const d=new Date().toLocaleDateString("id-ID",{day:"2-digit",month:"long",year:"numeric"});
const base=p+"-"+new Date().toISOString().slice(0,10); const shio=shios[rand(0,11,base+"-shio")];
document.getElementById("hasil").innerHTML=`
<div class="logo">
    <img src="${images[p] || ''}" alt="${p}">
</div>
<table>
<tr><th>Nama Pasaran</th><td>${p}</td></tr>
<tr><th>Tanggal</th><td>${d}</td></tr>
<tr><th>Bbfs Kuat</th><td>${rand(1000000,9999999,base+"-bbfs")}</td></tr>
<tr><th>Angka Ikut</th><td>${rand(10000,99999,base+"-ikut")}</td></tr>
<tr><th>4D (BB)</th><td>${list(5,1000,9999,base+"-4d")}</td></tr>
<tr><th>3D (BB)</th><td>${list(4,100,999,base+"-3d")}</td></tr>
<tr><th>2D (BB)</th><td>${list(10,10,99,base+"-2d")}</td></tr>  
<tr><th>Colok Bebas</th><td>${list(2,1,9,base+"-cb")}</td></tr>
<tr><th>Colok Macau</th><td>${list(3,10,99,base+"-cm")}</td></tr>
<tr><th>Twin</th><td>${String(rand(0,9,base+"-t1"))+String(rand(0,9,base+"-t1"))} / ${String(rand(0,9,base+"-t2"))+String(rand(0,9,base+"-t2"))}</td></tr>
<tr><th>Shio</th><td>${shio}</td></tr>
</table>
<button class='copy-btn' onclick='copyPrediksi()'>📋 COPY PREDIKSI</button>`;
}

function copyPrediksi(){
 const t=document.querySelector('#hasil table');
 if(!t)return;
 const rows=t.querySelectorAll('tr');
 let out='';
 rows.forEach(r=>{
  const th=r.querySelector('th')?.innerText.trim();
  const td=r.querySelector('td')?.innerText.trim();
  if(th&&td) out+=`${th} : ${td}\n`;
 });
 navigator.clipboard.writeText(out).then(()=>alert('Prediksi berhasil disalin!'));
}
